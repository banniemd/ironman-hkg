name: Monthly HKG IRONMAN Results Scraper

on:
  schedule:
    # Runs on the 1st day of every month at 02:00 UTC
    - cron: '0 2 1 * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hkg_finishers.json
          if git diff --staged --quiet; then
            echo "No changes detected in hkg_finishers.json."
          else
            git commit -m "chore: automated monthly update of HKG ironman results [skip ci]"
            git push
          fi
